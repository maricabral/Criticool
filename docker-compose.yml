services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: criticool
      POSTGRES_PASSWORD: criticool
      POSTGRES_DB: criticool
    ports:
      - "5432:5432"
    volumes:
      - criticool_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criticool -d criticool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - criticool_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  criticool_postgres:
  criticool_redis:
